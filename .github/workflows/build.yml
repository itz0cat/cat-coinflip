name: Build and Release Cat Coinflip

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-mc-1-21-11:
    name: Build Minecraft 1.21.11 (Target Java 21)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Java 25 (Loom 1.18 daemon)
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Run Common Unit Tests
        run: ./gradlew :common:test

      - name: Build 1.21.11 Mod
        run: ./gradlew :versions:1.21.11:build

      - name: Upload 1.21.11 Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cat-coinflip-mc1.21.11
          path: versions/1.21.11/build/libs/cat-coinflip-*+mc1.21.11.jar
          if-no-files-found: error

  build-mc-26-1-2:
    name: Build Minecraft 26.1.2 (Target Java 25)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle with cache
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build 26.1.2 Mod
        run: ./gradlew :versions:26.1.2:build

      - name: Upload 26.1.2 Mod Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cat-coinflip-mc26.1.2
          path: versions/26.1.2/build/libs/cat-coinflip-*+mc26.1.2.jar
          if-no-files-found: error

  release:
    name: Package Checksums and GitHub Release
    needs: [build-mc-1-21-11, build-mc-26-1-2]
    runs-on: ubuntu-latest
    steps:
      - name: Download 1.21.11 Jar
        uses: actions/download-artifact@v4
        with:
          name: cat-coinflip-mc1.21.11
          path: release-jars

      - name: Download 26.1.2 Jar
        uses: actions/download-artifact@v4
        with:
          name: cat-coinflip-mc26.1.2
          path: release-jars

      - name: Compute Checksums
        working-directory: release-jars
        run: |
          sha256sum *.jar > checksums.txt
          cat checksums.txt

      - name: Upload Release Checksums Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cat-coinflip-checksums
          path: release-jars/checksums.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-jars/*.jar
            release-jars/checksums.txt
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
